<!doctype html><meta charset="utf-8"><body>
<iframe id="a" src="../index.html" style="width:1920px;height:1080px"></iframe>
<iframe id="b" src="../index.html" style="width:390px;height:844px"></iframe>
<pre id="out"></pre>
<script>
function check(id){
  const d=document.getElementById(id).contentDocument;
  const st=d.createElement('style'); st.textContent='.step{visibility:visible!important;opacity:1!important}.claude .ln.step{display:block!important}'; d.head.appendChild(st);
  const ss=[...d.querySelectorAll('.slide')]; const bad=[];
  ss.forEach((s,i)=>{ ss.forEach(x=>x.style.display='none'); s.style.display='flex';
    const v=s.scrollHeight-s.clientHeight;
    let h=0; s.querySelectorAll('.term,.diagram,.tbl-wrap').forEach(t=>{h=Math.max(h,t.scrollWidth-t.clientWidth)});
    const dh=d.documentElement.scrollWidth-d.documentElement.clientWidth;
    if(v>2||h>2||dh>2) bad.push(`${i+1}: v${v} innerH${h} page${dh} ${(s.querySelector('h1,h2,h3')||{}).textContent?.slice(0,30)}`);
  });
  return id+' slides='+ss.length+'\n'+(bad.join('\n')||'OK');
}
setTimeout(()=>{document.getElementById('out').textContent=check('a')+'\n\n'+check('b')},2500);
</script>
